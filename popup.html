<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>TikDownload</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #eee;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(90deg, #25f4ee, #fe2c55);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 11px; color: #666; margin-bottom: 16px; }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px;
      background: #222;
      border-radius: 8px;
    }
    .stat {
      flex: 1;
      text-align: center;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: #25f4ee;
      display: block;
    }
    .stat-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn {
      padding: 10px;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: linear-gradient(135deg, #25f4ee, #fe2c55);
      color: #fff;
      grid-column: span 2;
    }
    .btn-secondary {
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #3a3a3a;
    }

    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #222;
      color: #eee;
      font-size: 12px;
      outline: none;
    }
    .field select:focus { border-color: #25f4ee; }

    .sep { margin: 14px 0; border: none; border-top: 1px solid #2a2a2a; }

    .link {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #25f4ee;
      text-decoration: none;
      padding: 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .link:hover { background: #222; }

    .status {
      text-align: center;
      font-size: 11px;
      color: #4caf50;
      min-height: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>✦ TikDownload</h1>
  <p class="subtitle">本次会话</p>

  <div class="stats">
    <div class="stat">
      <span class="stat-val" id="downloaded">0</span>
      <span class="stat-label">已下载</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="failed">0</span>
      <span class="stat-label">失败</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="batch-download">⬇ 下载本页全部</button>
    <button class="btn btn-secondary" id="open-history">⌚ 历史</button>
    <button class="btn btn-secondary" id="open-settings">⚙ 设置</button>
  </div>

  <hr class="sep">

  <div class="field">
    <label>快速切换画质</label>
    <select id="quality">
      <option value="highest">最高码率</option>
      <option value="resolution">最高分辨率</option>
      <option value="nowatermark">无水印优先</option>
    </select>
  </div>

  <p class="status" id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
